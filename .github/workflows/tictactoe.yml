name: Tic-tac-toe

on:
  issues:
    types: [opened]

jobs:
  move:
    if: startsWith(github.event.issue.title, 'ttt|')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      # User input goes through env vars, never straight into the shell script.
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_USER: ${{ github.event.issue.user.login }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_FILE: ${{ runner.temp }}/comment.md
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Play the move and push the new board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another move or the activity update may push first; start over from the latest board.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/tictactoe.py move
            if [[ -z "$(git status --porcelain)" ]]; then break; fi   # move rejected, nothing to commit
            git add README.md game/state.json
            git commit -q -m "Tic-tac-toe: move by @$ISSUE_USER"
            if git push -q origin HEAD:main; then break; fi
            sleep $((attempt * 3))
          done

      - name: Reply and close the issue
        if: always()
        run: |
          [[ -f "$COMMENT_FILE" ]] || echo "Something went wrong placing your move. Please try again in a minute." > "$COMMENT_FILE"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$COMMENT_FILE"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
